<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 왕국</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1208;
      font-family: 'Noto Serif KR', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;

      /* =============================================
         배경 이미지 설정
         images/background.jpg 파일을 올리면 자동 적용
         ============================================= */
      background-image: url('images/background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* 배경 위에 어두운 오버레이 (가독성 확보) */
    .bg-overlay {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(180,140,60,0.12) 0%, transparent 65%),
        rgba(10, 6, 0, 0.62);
      z-index: 1;
      pointer-events: none;
    }

    /* 스캔라인 효과 */
    .scanline {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px
      );
      z-index: 2;
      pointer-events: none;
    }

    /* ── 일시정지 버튼 ── */
    .pause-wrap {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
    }

    .pause-wrap button {
      background: rgba(10,7,2,0.88);
      border: 1.5px solid #6a5020;
      color: #b48c3c;
      font-family: 'Noto Serif KR', serif;
      font-size: 11px;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: border-color 0.15s, color 0.15s;
    }
    .pause-wrap button:hover { border-color: #b48c3c; color: #f0d080; }

    /* 일시정지 비밀번호 모달 */
    .pause-modal-bg {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 30;
      align-items: center;
      justify-content: center;
    }
    .pause-modal-bg.open { display: flex; }

    .pause-modal {
      width: 260px;
      border: 2px solid #b48c3c;
      background: rgba(10,7,2,0.97);
      padding: 24px 20px 20px;
      position: relative;
      text-align: center;
    }
    .pause-modal::before, .pause-modal::after {
      content: '';
      position: absolute;
      width: 10px; height: 10px;
      border: 1.5px solid #f0d080;
    }
    .pause-modal::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
    .pause-modal::after  { bottom:-1px; right:-1px; border-left:none; border-top:none; }

    .pause-modal-title {
      font-size: 13px;
      color: #f0d080;
      letter-spacing: 0.2em;
      margin-bottom: 16px;
    }

    .pause-modal input {
      width: 100%;
      background: rgba(0,0,0,0.6);
      border: 1.5px solid #6a5020;
      color: #f0d080;
      font-family: 'Noto Serif KR', serif;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      text-align: center;
    }
    .pause-modal input:focus { border-color: #b48c3c; }
    .pause-modal input::placeholder { color: #6a5020; }

    .pause-modal-row { display: flex; gap: 8px; }

    .pause-modal-row button {
      flex: 1;
      background: rgba(80,55,10,0.8);
      border: 1.5px solid #b48c3c;
      color: #f0d080;
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      padding: 8px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: background 0.15s;
    }
    .pause-modal-row button:hover { background: rgba(120,88,20,0.9); }
    .pause-modal-row button.cancel {
      background: transparent;
      border-color: #6a5020;
      color: #b48c3c;
    }

    .pause-msg {
      font-size: 11px;
      color: #c06060;
      margin-top: 8px;
      letter-spacing: 0.08em;
      min-height: 16px;
    }

    /* ── 로고 영역 ── */
    .frame-top {
      width: 100%;
      display: flex;
      justify-content: center;
      padding-top: 40px;
      position: relative;
      z-index: 3;
    }

    .logo-area {
      width: 320px;
      height: 100px;
      border: 2px solid rgba(180,140,60,0.5);
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .logo-area::before, .logo-area::after {
      content: '';
      position: absolute;
      width: 12px; height: 12px;
      border: 2px solid #b48c3c;
    }
    .logo-area::before { top:-2px; left:-2px; border-right:none; border-bottom:none; }
    .logo-area::after  { bottom:-2px; right:-2px; border-left:none; border-top:none; }
    .corner-bl { position:absolute; bottom:-2px; left:-2px; width:12px; height:12px; border:2px solid #b48c3c; border-right:none; border-top:none; }
    .corner-tr { position:absolute; top:-2px; right:-2px; width:12px; height:12px; border:2px solid #b48c3c; border-left:none; border-bottom:none; }

    /* =============================================
       로고 이미지
       images/logo.png 파일을 올리면 자동 적용
       크기: 300 × 80 px, PNG 배경투명
       ============================================= */
    .logo-img {
      width: 300px;
      height: 80px;
      object-fit: contain;
      display: block;
    }

    /* 이미지가 없을 때 보이는 임시 텍스트 */
    .logo-fallback {
      display: none; /* logo.png 올리면 이 줄 지우면 됨 */
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .logo-fallback span {
      font-size: 13px;
      color: #c8a84c;
      letter-spacing: 0.2em;
    }

    /* ── 구분선 ── */
    .divider {
      width: 320px;
      height: 2px;
      background: linear-gradient(to right, transparent, #b48c3c 30%, #f0d080 50%, #b48c3c 70%, transparent);
      margin: 20px 0 26px;
      position: relative;
      z-index: 3;
    }

    /* ── 메뉴 버튼 ── */
    .menu-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 3;
    }

    .menu-btn {
      width: 220px;
      height: 52px;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
      text-decoration: none;
    }
    .menu-btn:hover { transform: scale(1.04); }
    .menu-btn:active { transform: scale(0.97); }

    /* =============================================
       버튼 배경 이미지
       각 버튼마다 이미지 파일을 지정하세요
       크기: 220 × 52 px, PNG
       btn-character → images/btn_character.png
       btn-quest     → images/btn_quest.png
       btn-battle    → images/btn_battle.png
       btn-raid      → images/btn_raid.png
       ============================================= */
    .menu-btn .btn-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    /* 이미지 없을 때 기본 프레임 */
    .menu-btn .btn-frame {
      position: absolute;
      inset: 0;
      border: 2px solid #b48c3c;
      background: rgba(10,7,2,0.82);
    }
    .menu-btn .btn-frame::before, .menu-btn .btn-frame::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border: 1.5px solid #f0d080;
    }
    .menu-btn .btn-frame::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
    .menu-btn .btn-frame::after  { bottom:-1px; right:-1px; border-left:none; border-top:none; }

    .menu-btn .cursor {
      position: absolute;
      left: -22px;
      font-size: 14px;
      color: #f0d080;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .menu-btn:hover .cursor { opacity: 1; }

    .menu-btn .btn-label {
      position: relative;
      z-index: 1;
      font-size: 14px;
      color: #f0d080;
      letter-spacing: 0.2em;
      text-shadow: 0 0 10px rgba(240,208,128,0.5), 1px 1px 0 #000;
      font-weight: 700;
    }

    /* ── 로그인 박스 ── */
    .bottom-area {
      margin-top: 32px;
      position: relative;
      z-index: 3;
      padding-bottom: 32px;
    }

    .login-box {
      width: 280px;
      border: 1.5px solid #b48c3c;
      background: rgba(10,7,2,0.85);
      padding: 18px 18px 16px;
      position: relative;
    }
    .login-box::before, .login-box::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border: 1.5px solid #f0d080;
    }
    .login-box::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
    .login-box::after  { bottom:-1px; right:-1px; border-left:none; border-top:none; }
    .lb-c1 { position:absolute; bottom:-1px; left:-1px; width:8px; height:8px; border:1.5px solid #f0d080; border-right:none; border-top:none; }
    .lb-c2 { position:absolute; top:-1px; right:-1px; width:8px; height:8px; border:1.5px solid #f0d080; border-left:none; border-bottom:none; }

    .login-label {
      font-size: 11px;
      color: #b48c3c;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
      text-align: center;
    }

    .login-row { display: flex; gap: 8px; }

    .rpg-input {
      flex: 1;
      background: rgba(0,0,0,0.6);
      border: 1.5px solid #6a5020;
      color: #f0d080;
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      padding: 9px 10px;
      outline: none;
      letter-spacing: 0.08em;
      transition: border-color 0.15s;
    }
    .rpg-input:focus { border-color: #b48c3c; }
    .rpg-input::placeholder { color: #6a5020; }

    .rpg-btn {
      background: rgba(80,55,10,0.8);
      border: 1.5px solid #b48c3c;
      color: #f0d080;
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      padding: 9px 14px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .rpg-btn:hover { background: rgba(120,88,20,0.9); }

    .login-msg {
      font-size: 11px;
      color: #c06060;
      margin-top: 8px;
      text-align: center;
      letter-spacing: 0.08em;
      min-height: 16px;
    }

    .copyright {
      position: relative;
      z-index: 3;
      font-size: 10px;
      color: rgba(180,140,60,0.3);
      letter-spacing: 0.18em;
      text-align: center;
      padding: 0 0 20px;
    }
  </style>
</head>
<body>

<div class="page">
  <div class="bg-overlay"></div>
  <div class="scanline"></div>

  <!-- ── 일시정지 버튼 ── -->
  <div class="pause-wrap">
    <button onclick="openPause()">⏸ PAUSE</button>
  </div>

  <!-- ── 일시정지 모달 ── -->
  <div class="pause-modal-bg" id="pauseModal">
    <div class="pause-modal">
      <div class="pause-modal-title">── 관리자 확인 ──</div>
      <input type="password" id="pauseInput" placeholder="비밀번호 입력" />
      <div class="pause-modal-row">
        <button onclick="confirmPause()">확인</button>
        <button class="cancel" onclick="closePause()">취소</button>
      </div>
      <div class="pause-msg" id="pauseMsg"></div>
    </div>
  </div>

  <!-- ── 로고 ── -->
  <div class="frame-top">
    <div class="logo-area">
      <div class="corner-bl"></div>
      <div class="corner-tr"></div>
      <!-- logo.png 올리면 아래 img 태그가 보임 -->
      <img class="logo-img" src="images/logo.png"
           onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';"
           alt="로고">
      <div class="logo-fallback">
        <span>[ LOGO ]</span>
        <span style="font-size:10px; color:#6a5020;">images/logo.png (300×80px)</span>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- ── 메뉴 버튼 ── -->
  <div class="menu-area">

    <a class="menu-btn" href="character.html">
      <img class="btn-bg" src="images/btn_character.png"
           onerror="this.style.display='none';" alt="">
      <div class="btn-frame"></div>
      <span class="cursor">▶</span>
      <span class="btn-label">캐릭터 보기</span>
    </a>

    <a class="menu-btn" href="quest.html">
      <img class="btn-bg" src="images/btn_quest.png"
           onerror="this.style.display='none';" alt="">
      <div class="btn-frame"></div>
      <span class="cursor">▶</span>
      <span class="btn-label">주간 퀘스트</span>
    </a>

    <a class="menu-btn" href="battle.html">
      <img class="btn-bg" src="images/btn_battle.png"
           onerror="this.style.display='none';" alt="">
      <div class="btn-frame"></div>
      <span class="cursor">▶</span>
      <span class="btn-label">단체 전투</span>
    </a>

    <a class="menu-btn" href="raid.html">
      <img class="btn-bg" src="images/btn_raid.png"
           onerror="this.style.display='none';" alt="">
      <div class="btn-frame"></div>
      <span class="cursor">▶</span>
      <span class="btn-label">레이드</span>
    </a>

  </div>

  <!-- ── 로그인 ── -->
  <div class="bottom-area">
    <div class="login-box">
      <div class="lb-c1"></div>
      <div class="lb-c2"></div>
      <div class="login-label">── 모험가 입장 ──</div>
      <div class="login-row">
        <input class="rpg-input" type="password" id="loginInput" placeholder="비밀번호를 입력하시오" />
        <button class="rpg-btn" onclick="doLogin()">입장</button>
      </div>
      <div class="login-msg" id="loginMsg"></div>
    </div>
  </div>

  <div class="copyright">PRESS ANY KEY TO CONTINUE</div>
</div>

<script>
  /* ── 관리자 비밀번호 (나중에 백엔드로 이전할 예정) ── */
  const ADMIN_PASSWORD = 'admin1234'; // ← 여기만 바꾸면 됨

  /* ── 일시정지 ── */
  function openPause() {
    document.getElementById('pauseModal').classList.add('open');
    document.getElementById('pauseInput').value = '';
    document.getElementById('pauseMsg').textContent = '';
    setTimeout(() => document.getElementById('pauseInput').focus(), 50);
  }

  function closePause() {
    document.getElementById('pauseModal').classList.remove('open');
  }

  function confirmPause() {
    const val = document.getElementById('pauseInput').value;
    if (val === ADMIN_PASSWORD) {
      closePause();
      alert('관리자 모드 활성화');
      // 나중에 실제 관리자 기능 연결 예정
    } else {
      document.getElementById('pauseMsg').textContent = '비밀번호가 올바르지 않습니다';
    }
  }

  document.getElementById('pauseInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmPause();
  });

  /* ── 플레이어 로그인 ── */
  function doLogin() {
    const pw = document.getElementById('loginInput').value.trim();
    if (!pw) {
      document.getElementById('loginMsg').textContent = '비밀번호를 입력하세요';
      return;
    }
    // 나중에 백엔드 인증으로 교체 예정
    document.getElementById('loginMsg').textContent = '확인 중...';
  }

  document.getElementById('loginInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>

</body>
</html>
